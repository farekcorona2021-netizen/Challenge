<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>تحديث النظام</title>
<style>
  :root{
    --bone:#c9c7bd;
    --wall:#3a3d3f;
    --wall-dark:#141516;
    --glow:#8fb8c9;
    --blood:#7a0f14;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:#0a0a0b;
    overflow:hidden;
    font-family:'Tahoma','Segoe UI',sans-serif;
  }

  /* ---------- شاشة التحميل الوهمية ---------- */
  #loading{
    position:fixed;inset:0;
    background:#050505;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    gap:18px;
    z-index:50;
    transition:opacity .6s ease;
  }
  #loading p{
    color:#8a8a8a;
    font-size:14px;
    letter-spacing:1px;
  }
  .bar{
    width:260px;height:6px;
    background:#1c1c1c;
    border-radius:4px;
    overflow:hidden;
  }
  .bar-fill{
    height:100%;width:0%;
    background:linear-gradient(90deg,#4a4a4a,var(--glow));
    animation:load 2.8s ease-in-out forwards;
  }
  @keyframes load{ to{ width:100%; } }

  /* ---------- المشهد ---------- */
  #scene{
    position:fixed;inset:0;
    display:flex;align-items:center;justify-content:center;
    opacity:0;
  }
  .room{
    position:absolute;inset:0;
    background:
      radial-gradient(ellipse at 30% 15%, rgba(143,184,201,.10), transparent 55%),
      linear-gradient(180deg,var(--wall) 0%, var(--wall-dark) 70%, #000 100%);
  }
  /* أعمدة خلفية توحي بغرفة قديمة، مثل الصورة */
  .column{
    position:absolute;top:0;bottom:0;width:38px;
    background:repeating-linear-gradient(180deg,#4a4d4f 0 6px,#35373a 6px 12px);
    filter:blur(.3px);
    opacity:.55;
  }
  .col-l{left:6%;}
  .col-r{right:8%;}
  .vignette{
    position:absolute;inset:0;
    background:radial-gradient(ellipse at center, transparent 35%, rgba(0,0,0,.85) 100%);
  }

  /* ---------- الشخصية (رسمة أصلية بروح المشهد المظلم) ---------- */
  .figure{
    position:relative;
    width:340px;height:520px;
    transform:translateY(40px);
    filter:drop-shadow(0 20px 40px rgba(0,0,0,.8));
  }
  .coat{
    position:absolute;
    left:50%;top:170px;
    transform:translateX(-50%);
    width:270px;height:350px;
    background:linear-gradient(160deg,#161613 0%, #050504 60%);
    border-radius:40% 40% 20% 20% / 30% 30% 15% 15%;
    box-shadow:inset 0 0 60px rgba(0,0,0,.9), inset 20px 0 40px rgba(255,255,255,.02);
  }
  .collar{
    position:absolute;
    left:50%;top:150px;
    transform:translateX(-50%);
    width:150px;height:90px;
    background:#0c0c0a;
    border-radius:50% 50% 30% 30%;
    box-shadow:inset 0 -10px 20px rgba(0,0,0,.9);
  }
  .neck{
    position:absolute;
    left:50%;top:150px;
    transform:translateX(-50%);
    width:38px;height:60px;
    background:linear-gradient(180deg,#c9ab8f,#8a6f59);
    border-radius:10px;
  }
  .head{
    position:absolute;
    left:50%;top:40px;
    transform:translateX(-50%);
    width:130px;height:150px;
    background:linear-gradient(200deg,#d9bfa5 0%, #a4826a 60%, #6f5443 100%);
    border-radius:45% 45% 42% 42% / 50% 50% 45% 45%;
  }
  .hair{
    position:absolute;
    left:50%;top:20px;
    transform:translateX(-50%);
    width:150px;height:130px;
    background:radial-gradient(ellipse at 50% 20%, #1c1712, #050403 75%);
    border-radius:50% 50% 40% 40% / 60% 60% 30% 30%;
    clip-path:polygon(0 25%,15% 0,85% 0,100% 25%,95% 70%,70% 100%,55% 55%,45% 100%,30% 65%,5% 70%);
  }
  .eye{
    position:absolute;top:96px;
    width:10px;height:5px;
    background:var(--glow);
    border-radius:50%;
    box-shadow:0 0 6px 2px rgba(143,184,201,.5);
    opacity:.85;
  }
  .eye.l{left:44px;}
  .eye.r{right:44px;}

  .glint{
    position:absolute;left:8%;top:22%;
    width:40%;height:60%;
    background:linear-gradient(115deg, rgba(255,255,255,.06) 0%, transparent 30%);
    pointer-events:none;
  }

  /* ---------- ومضة الرعب ---------- */
  .flash{
    position:fixed;inset:0;
    background:#fff;
    opacity:0;
    z-index:40;
    pointer-events:none;
  }

  #caption{
    position:absolute;
    bottom:8%;left:50%;
    transform:translateX(-50%);
    color:var(--blood);
    font-size:34px;
    font-weight:700;
    letter-spacing:2px;
    text-shadow:0 0 12px rgba(122,15,20,.8);
    opacity:0;
    text-align:center;
  }
  #sub{
    position:absolute;
    bottom:3%;left:50%;
    transform:translateX(-50%);
    color:#bbb;
    font-size:15px;
    opacity:0;
  }

  .shake{ animation:shake .4s linear 2; }
  @keyframes shake{
    0%,100%{transform:translate(0,0);}
    20%{transform:translate(-6px,3px);}
    40%{transform:translate(6px,-3px);}
    60%{transform:translate(-4px,2px);}
    80%{transform:translate(4px,-2px);}
  }
</style>
</head>
<body>

  <div id="loading">
    <p>جارِ تحديث النظام… لا تُغلق الصفحة</p>
    <div class="bar"><div class="bar-fill"></div></div>
  </div>

  <div class="flash" id="flash"></div>

  <div id="scene">
    <div class="room">
      <div class="column col-l"></div>
      <div class="column col-r"></div>
    </div>
    <div class="figure" id="figure">
      <div class="coat"></div>
      <div class="collar"></div>
      <div class="neck"></div>
      <div class="head">
        <div class="glint"></div>
      </div>
      <div class="hair"></div>
      <div class="eye l"></div>
      <div class="eye r"></div>
    </div>
    <div class="vignette"></div>
    <div id="caption">التفت خلفك 👀</div>
    <div id="sub">اضغط في أي مكان… إذا قدرت</div>
  </div>

<script>
  const loading   = document.getElementById('loading');
  const scene     = document.getElementById('scene');
  const flash     = document.getElementById('flash');
  const figure    = document.getElementById('figure');
  const caption   = document.getElementById('caption');
  const sub       = document.getElementById('sub');

  // صوت خفقان قلب بسيط بدون ملفات خارجية
  function beat(ctx, time, freq, gain){
    const osc = ctx.createOscillator();
    const g   = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(freq, time);
    g.gain.setValueAtTime(0, time);
    g.gain.linearRampToValueAtTime(gain, time + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
    osc.connect(g).connect(ctx.destination);
    osc.start(time);
    osc.stop(time + 0.3);
  }

  function jumpScare(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const now = ctx.currentTime;
      beat(ctx, now, 60, 0.35);
      beat(ctx, now + 0.35, 55, 0.35);
    }catch(e){}

    scene.style.transition = 'opacity .05s';
    scene.style.opacity = '1';

    flash.style.transition = 'opacity .08s';
    flash.style.opacity = '.9';
    setTimeout(()=>{ flash.style.opacity = '0'; }, 90);

    document.body.classList.add('shake');
    setTimeout(()=> document.body.classList.remove('shake'), 800);

    setTimeout(()=>{
      caption.style.transition = 'opacity .5s';
      caption.style.opacity = '1';
      sub.style.transition = 'opacity .5s';
      sub.style.opacity = '1';
    }, 400);
  }

  window.addEventListener('load', ()=>{
    setTimeout(()=>{
      loading.style.opacity = '0';
      setTimeout(()=>{
        loading.style.display = 'none';
        jumpScare();
      }, 600);
    }, 2900);
  });

  scene.addEventListener('click', ()=>{
    caption.textContent = 'هههههه انخدعت 😂';
    sub.textContent = 'مجرد مقلب أخوك يحبك ❤️';
    figure.style.transition = 'transform .6s ease, opacity .6s ease';
    figure.style.opacity = '0';
    figure.style.transform = 'translateY(40px) scale(.9)';
  });
</script>
</body>
</html>
