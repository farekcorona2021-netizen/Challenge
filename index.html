<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Update...</title>
    <style>
        body { 
            background-color: black; 
            color: #0f0; /* لون أخضر مثل الهاكرز */
            font-family: 'Courier New', Courier, monospace; 
            padding: 20px; 
            font-size: 1.2rem; 
            overflow: hidden;
        }
        #cursor { 
            animation: blink 1s infinite; 
        }
        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0; } 
        }
        .hidden { 
            display: none; 
        }
        .troll-container {
            text-align: center;
            margin-top: 30vh;
        }
        .troll-msg { 
            color: red; 
            font-size: 3rem; 
            font-weight: bold; 
        }
        .sub-msg {
            color: white;
            font-size: 1.5rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div id="console"></div><span id="cursor">_</span>
    
    <div id="troll-container" class="hidden troll-container">
        <div class="troll-msg">تم سحب الأيبي بنجاح! 😈</div>
        <div class="sub-msg">جهزوا نفسكم للجلد، وسلم لي على رانكك أنت وياه 😂</div>
    </div>

    <script>
        // الجمل اللي تطلع كأنها اختراق
        const texts = [
            "Connecting to local server...",
            "Bypassing device firewall...",
            "Extracting IP address...",
            "Accessing PlayStation Network credentials...",
            "Downloading browser history...",
            "Downgrading Rocket League rank to Bronze...",
            "Uploading all data to Fares's Server...",
            "Done! 100%"
        ];
        
        let i = 0;
        const consoleDiv = document.getElementById("console");
        const trollContainer = document.getElementById("troll-container");
        const cursor = document.getElementById("cursor");

        function typeText() {
            if (i < texts.length) {
                consoleDiv.innerHTML += texts[i] + "<br><br>";
                i++;
                // سرعة ظهور الجمل (1500 يعني ثانية ونص)
                setTimeout(typeText, 1500);
            } else {
                setTimeout(() => {
                    consoleDiv.innerHTML = "";
                    cursor.style.display = "none";
                    trollContainer.classList.remove("hidden");
                }, 1000);
            }
        }
        
        // يبدأ المقلب بعد ثانية من فتح الموقع
        setTimeout(typeText, 1000);
    </script>
</body>
</html>
