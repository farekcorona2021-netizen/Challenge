<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Loading...</title>
    <style>
        body {
            background-color: #000;
            color: #0f0; /* لون أخضر هاكرز */
            font-family: monospace;
            font-size: 7px; /* الخط صغير عشان تطلع تفاصيل وجه ليون واضحة */
            line-height: 7px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        pre {
            margin: 0;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- هنا بتنطبع الرسمة -->
    <pre id="ascii-art">جارِ سحب البيانات وفك التشفير...</pre>

    <!-- حطينا رابط صورتك مع بروكسي عشان المتصفح يسمح لنا نقرا ألوانها برمجياً -->
    <img id="source-image" crossorigin="anonymous" src="https://api.allorigins.win/raw?url=https://i.postimg.cc/McCsbRvv/d771d4f267da4f54a1cc3ccc07570a2d.webp" style="display: none;">
    <canvas id="canvas" style="display: none;"></canvas>

    <script>
        window.onload = function() {
            const img = document.getElementById('source-image');
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');
            const asciiArt = document.getElementById('ascii-art');

            // ترتيب الحروف من الفاضي (للأماكن المظلمة) إلى الغامق (للأماكن الفاتحة في وجه ليون)
            const chars = [' ', '.', ':', '-', '=', '+', '*', '#', '%', '8', '@'];

            img.onload = function() {
                asciiArt.innerHTML = ''; // نمسح رسالة التحميل

                // العرض 120 بيكسل (كل ما زاد الرقم زادت التفاصيل بس كبرت الرسمة)
                const width = 150; 
                const height = Math.floor((img.height / img.width) * width * 0.55);

                canvas.width = width;
                canvas.height = height;

                ctx.drawImage(img, 0, 0, width, height);
                
                let imageData;
                try {
                    imageData = ctx.getImageData(0, 0, width, height);
                } catch(e) {
                    asciiArt.innerHTML = "SYSTEM ERROR: ACCESS DENIED";
                    return;
                }

                const data = imageData.data;
                let asciiString = '';

                // تحويل البيكسلات إلى كود
                for (let i = 0; i < data.length; i += 4) {
                    const r = data[i];
                    const g = data[i + 1];
                    const b = data[i + 2];
                    
                    const brightness = (r + g + b) / 3;
                    const charIndex = Math.floor((brightness / 255) * (chars.length - 1));
                    asciiString += chars[charIndex];

                    if (((i / 4) + 1) % width === 0) {
                        asciiString += '\n';
                    }
                }

                const lines = asciiString.split('\n');
                let currentLine = 0;

                // دالة رسم سطر ورا سطر (الأنيميشن)
                function typeLine() {
                    if (currentLine < lines.length) {
                        asciiArt.innerHTML += lines[currentLine] + '\n';
                        currentLine++;
                        setTimeout(typeLine, 15); // سرعة الطباعة (تقدر تصغر الرقم عشان يسرع)
                    } else {
                        setTimeout(() => {
                            asciiArt.innerHTML += '\n\n[SYSTEM OVERRIDE] - Leon S. Kennedy Has Infiltrated Your Device. 🔫😎';
                        }, 500);
                    }
                }

                typeLine();
            };

            if (img.complete) {
                img.onload();
            }
        };
    </script>
</body>
</html>
